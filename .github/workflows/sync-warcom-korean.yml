name: Sync Official Korean WarCom Datacards

on:
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-warcom-korean
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install

      - name: Install Playwright Chromium
        run: poetry run python -m playwright install --with-deps chromium

      - name: Sync official Korean WarCom build
        run: poetry run python script/sync_official_korean_warcom.py --branch "${GITHUB_REF_NAME}" --require-korean-pdfs --force-scrape --min-korean-pdfs 30

      - name: Commit and push changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes after git add."
            exit 0
          fi

          git commit -m "Auto-sync official Korean WarCom datacards"
          git push
